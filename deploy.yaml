apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brain-app
  template:
    metadata:
      labels:
        app: brain-app
    spec:
      containers:
        - name: brain-app
          image: 092671055228.dkr.ecr.ap-south-1.amazonaws.com/docker/brain-task:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
